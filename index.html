<!DOCTYPE html>
<html lang="en">

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Gotham', 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        .left-panel { flex: 1; background-color: #e3e5e8; display: none; align-items: center; justify-content: center; padding: 40px; }
        .left-panel img { width: 100%; max-width: 300px; height: auto; }
        
        /* Right Side (Form) */
        .right-panel { flex: 1; padding: 48px; display: flex; flex-direction: column; justify-content: center; }
        
        /* Header */
        .logo-mobile { display: block; width: 120px; margin: 0 auto 24px auto; }
        h1 { font-size: 28px; font-weight: 500; color: #232527; margin-bottom: 8px; text-align: left; }
        p.subtitle { font-size: 14px; color: #393b3d; margin-bottom: 24px; }

        .input-group { margin-bottom: 16px; position: relative; }

        .input-group input { width: 100%; padding: 12px 16px; border: 1px solid #b8b8b8; border-radius: 8px; font-size: 16px; color: #232527; outline: none; transition: border-color 0.2s; background: #fff; }

        .login-btn:hover { background-color: #008fcc; }
        .login-btn:disabled { background-color: #b8b8b8; cursor: not-allowed; }
        
        /* Footer Links */
        .footer-links { margin-top: 24px; text-align: center; font-size: 14px; }
